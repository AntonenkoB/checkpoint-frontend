<ion-content>
  <div class="login">
    <div class="back-container">
      <div class="back-wrap container">
        <div class="back" [innerHTML]="BACK_SVG" (click)="goBack()"></div>
      </div>
    </div>

    <div class="logo-wrap">
      <div class="logo" [innerHTML]="LOGO_SVG"></div>
    </div>

    <div class="login-container container">
      <ion-item>
        <ion-input
            fill="solid"
            class="name"
            type="text"
            [maxlength]="64"
            [helperText]="' '"
            [errorText]="authFacade.loginFailure() ?? '' | translate"
            [placeholder]="'login.new-password' | translate"
            [class.ion-touched]="!!authFacade.loginFailure()"
            [class.ion-invalid]="!!authFacade.loginFailure()"
            (ionInput)="changePassword(($event.detail.value) ?? '')"
        >
        </ion-input>
      </ion-item>

      @if (!platform.is('capacitor')) {
        <ion-checkbox
            cpCustomCheckbox
            class="save-me"
            labelPlacement="end"
            (ionChange)="repeat.set($event.detail.checked)"
        >{{ "login.remember-me" | translate }}</ion-checkbox>
      }

      <div class="send-wrap">
        <cp-buttons
            [title]="'login.continue' | translate"
            [isLoader]="authFacade.isLoading()"
            (submit)="send()"
        ></cp-buttons>
      </div>
    </div>
  </div>
</ion-content>
