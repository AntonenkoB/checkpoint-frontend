<ion-content>
  <div class="login">
    <div class="back-container">
      <div class="back-wrap container">
        <div class="back" [innerHTML]="BACK_SVG" (click)="goBack()"></div>
      </div>
    </div>

    <div class="logo-wrap">
      <div class="logo" [innerHTML]="LOGO_SVG"></div>
    </div>

    <div class="login-container container">
      <ion-item>
        <ion-input
            fill="solid"
            class="name"
            type="password"
            [maxlength]="64"
            [helperText]="' '"
            [errorText]="'errors.min-length-password' | translate"
            [class.ion-touched]="validateCreatePassword()"
            [class.ion-invalid]="validateCreatePassword()"
            [placeholder]="'login.new-password' | translate"
            (ionBlur)="checkValidatePassword(createPassword().password)"
            (ionInput)="changePassword(($event.detail.value) ?? '')"
        >
          <ion-input-password-toggle
              noRipple
              slot="end"
              showIcon="my-eye-off"
              hideIcon="my-eye"
          />
        </ion-input>
      </ion-item>

      @if (!platform.is('capacitor')) {
        <ion-checkbox
            cpCustomCheckbox
            class="save-me"
            labelPlacement="end"
            (ionChange)="repeat.set($event.detail.checked)"
        >{{ "login.remember-me" | translate }}</ion-checkbox>
      }

      <ion-button class="send" (click)="send()">{{ "login.continue" | translate }}</ion-button>
    </div>
  </div>
</ion-content>
