<ion-content>
  <div class="login">
    <div class="logo-wrap">
      <div class="logo" [innerHTML]="LOGO_SVG"></div>
    </div>

    <div class="login-container container">
      <ion-item>
        <ion-input
            fill="solid"
            class="name"
            type="text"
            inputmode="email"
            [maxlength]="64"
            [helperText]="' '"
            [value]="name()"
            [errorText]="checkUserFailure() ?? '' | translate"
            [placeholder]="'login.creative-name' | translate"
            [class.ion-touched]="!!checkUserFailure()"
            [class.ion-invalid]="!!checkUserFailure()"
            (ionInput)="changeName($event.detail.value ?? '')"
        ></ion-input>
      </ion-item>

      <div class="send-wrap">
        <cp-buttons
            [title]="'login.continue' | translate"
            [isLoader]="authFacade.isLoading()"
            (submit)="send()"
        ></cp-buttons>
      </div>

    </div>
  </div>
</ion-content>
