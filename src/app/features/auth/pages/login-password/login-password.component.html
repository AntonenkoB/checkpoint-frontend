<ion-content>
  <div class="login">
    <div class="back-container">
      <div class="back-wrap container">
        <div class="back" [innerHTML]="BACK_SVG" (click)="goBack()"></div>
      </div>
    </div>

    <div class="logo-wrap">
      <div class="logo" [innerHTML]="LOGO_SVG"></div>
    </div>

    <div class="login-container container">
      <ion-item>
        <ion-input
            fill="solid"
            class="name"
            type="password"
            [maxlength]="64"
            [helperText]="' '"
            [value]="password()"
            [errorText]="loginFailure() ?? '' | translate"
            [placeholder]="'login.password' | translate"
            [class.ion-touched]="!!loginFailure()"
            [class.ion-invalid]="!!loginFailure()"
            (ionInput)="inputPassword($event.detail.value ?? '')"
        >
          <ion-input-password-toggle
              noRipple
              slot="end"
              showIcon="my-eye-off"
              hideIcon="my-eye"
          />
        </ion-input>
      </ion-item>

      @if (!platform.is('capacitor')) {
        <ion-checkbox
            class="save-me"
            labelPlacement="end"
            cpCustomCheckbox
            (ionChange)="repeat.set($event.detail.checked)"
        >{{ "login.remember-me" | translate }}</ion-checkbox>
      }

      <div class="forgot-password-wrap">
        <div class="forgot-password" (click)="forgotPassword()">{{ "login.reset-password" | translate }}</div>
      </div>

      <ion-button class="send" (click)="send()">{{ "login.continue" | translate }}</ion-button>
    </div>
  </div>
</ion-content>
