<div class="record-time">
  <div class="container">
    <cp-header-secondary
        [title]="'record.time-title' | translate"
        (close)="lessonsFacade.goToBack()"

    ></cp-header-secondary>
    @if (lessonsFacade.currentActionUser()!) {
      <cp-record-student-item
          class="student-item"
          [withAmountLesson]="false"
          [student]="lessonsFacade.currentActionUser()!"
      ></cp-record-student-item>
    }
  </div>

  @if (isFullCalendar()) {
    <div class="record-calendar">
      <cp-calendar
          [disableEmpty]="true"
          [activeDays]="calendarActiveDays()"
          [scheduleDay]="activeDay()"
          (selectDay)="selectDay($event)"
      ></cp-calendar>
    </div>
  } @else {
    <div class="container record-calendar-short">
      <cp-calendar-short
          [activeDays]="calendarActiveDays()"
          [selectedDay]="activeDay()"
          (selectDay)="selectShortDay($event)"
      ></cp-calendar-short>
    </div>
  }

  <div class="record-time-list">
    <cp-day-pager-swipe
        [days]="pagerSwipeDays()"
        [activeDay]="activeDay()"
        (activeDayChange)="changeDay($event)"
    >
      <ng-template let-day>
        <div class="container">
          <cp-time-list
              [disabledSlots]="recordTimeFacade.getDisabledSlotsForDay(day)"
              [activeSlots]="day === activeDay() ? activeTime() : []"
              [isHideInactive]="lessonsFacade.isStudent()"
              [onlyOne]="true"
              (selectTime)="selectedTime($event)"
          ></cp-time-list>
        </div>
      </ng-template>
    </cp-day-pager-swipe>
  </div>
  <div class="container">
    <cp-buttons
        [title]="'schedule.btn-planing' | translate"
        [disabled]="!activeTime().length"
        [isLoader]="recordTimeFacade.isLoading()"
        (submit)="save()"
    ></cp-buttons>
  </div>
</div>
