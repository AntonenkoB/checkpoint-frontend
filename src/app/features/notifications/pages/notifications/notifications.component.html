<div class="container">
  <cp-header-secondary
      [title]="'notification.title' | translate"
      (close)="notificationsFacade.toBackPage()"
  ></cp-header-secondary>
</div>
<ion-content>
<!--  <ion-refresher slot="fixed" (ionRefresh)="handleRefresh($event)">-->
<!--    <ion-refresher-content></ion-refresher-content>-->
<!--  </ion-refresher>-->
  <div class="notifications-wrap">
    <div class="container">
      @if (notificationsFacade.notifications().length > 0) {
        <div class="notifications">
          @for (notification of notificationsFacade.notifications(); track notification.id) {
            <cp-notification-item
                class="cp-notification-item"
                [notification]="notification"
                [isLoading]="notificationsFacade.isLoading()"
                [loadingProcessingId]="notificationsFacade.loadingProcessingId()"
                (readNotification)="notificationsFacade.readNotification(notification.id)"
            ></cp-notification-item>
          }
        </div>
      } @else {
        <div class="empty-wrap">
          <cp-empty-state></cp-empty-state>
        </div>
      }
    </div>
  </div>
  
  <ion-infinite-scroll
      [disabled]="!notificationsFacade.canLoadMoreNotifications()"
      (ionInfinite)="onInfiniteLoadNotifications($event)">
    <ion-infinite-scroll-content loadingSpinner="crescent"></ion-infinite-scroll-content>
  </ion-infinite-scroll>
</ion-content>
