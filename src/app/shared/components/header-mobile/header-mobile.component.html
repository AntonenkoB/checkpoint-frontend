<div class="header-mobile">
  <cp-tabs
      class="header-tabs"
      [tabList]="USER_ROLE_TABS()"
      [activeTab]="activeMenu()"
      [amountStudents]="amountStudents()"
      (segmentChange)="menuChange($event)"
  ></cp-tabs>
  <cp-avatar
      class="header-avatar"
      [src]="profile()?.avatar ?? ''"
      (click)="goToProfile.emit()"></cp-avatar>
</div>
