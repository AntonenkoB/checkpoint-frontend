<div class="record-student" (click)="selectStudent()">
  <cp-avatar class="avatar" [src]="student()?.avatar ?? ''"></cp-avatar>

  <div class="record-info">
    <div class="record-info-top">
      <div class="record-creative-name">{{getCreativeName()}}</div>
      @if (withAmountLesson()) {
        <div class="record-lessons-amount">1</div>
      }
    </div>

    <div class="record-info-bottom">
      <div class="record-name">{{getName()}}</div>
      @if (withAmountLesson()) {
        <div class="record-lessons">урок</div>
      }
    </div>
  </div>
</div>
